name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    # No inputs, and each absence is a decision rather than an oversight:
    #
    # `features:` — this crate declares none. The durable backend it is tested against
    # is `ikigai-store`'s `persistent`, enabled on the DEV-dependency in Cargo.toml, so
    # `cargo test` already builds and runs `tests/durable.rs` over real RocksDB with no
    # input here. (It costs an `oxrocksdb-sys` build on a cache miss. That is the price
    # of testing the composition this module exists for rather than only its in-memory
    # twin.)
    #
    # `wasm-lib:` — deliberately NOT claimed. Nothing here is wasm-hostile, but a gate
    # that has never run is not evidence, and this module's whole job is to talk to a
    # durable store that has no wasm face. When a browser host wants the ledger, the
    # line goes in with the work that makes it true.
