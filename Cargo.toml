[package]
name = "ikigai-ledger"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-ledger"
homepage = "https://github.com/ikigai-rs/ikigai-ledger"
keywords = ["ikigai", "roc", "issues", "rdf", "ledger"]
categories = ["development-tools"]
description = "The work ledger for ikigai: NAMED ledgers — one named graph and one capability each — holding items, comments, labels, links and claims as RDF in a durable store, with view/query/append/comment/close/delete as capability-gated resources, and `urn:iki:ledger:next`, a deterministic ready set under a pluggable ordering policy that refuses a blocked cycle and explains its own ranking."

# ★ WHY THIS CRATE OWNS NO BYTES. Everything here is authored as SPARQL and issued
# through the kernel at `urn:iki:store:*` — `ikigai-store` owns the dataset, the write
# lock and the golden threads. That is not a layering preference: `DurableStore`'s
# handle is `pub(crate)` by design (handing it out forfeits cacheability for the life
# of the store), so an in-process consumer reaches the data the same way a remote one
# does. The consequence a host must know: this module is inert unless a store space is
# bound in the same kernel. See `README.md`, "Composition".
#
# ⚠ AND THE CONSEQUENCE FOR SEGMENTATION: a ledger is a named graph, but the store's
# read and write scopes are both dataset-wide in 0.2.0, so this crate's per-ledger
# capabilities gate its own resources and nothing else. `README.md`, "What is enforced,
# and where", states exactly which half is which.

[dependencies]
# 0.1.89 is the true minimum: it is where `space_iri` arrives (`space()` names itself
# `urn:iki:space:ledger`, ledger #987), and where binding a door drops a space's name, so a
# host that extends `space()` does not carry the claim over different doors. (0.1.80 was the
# floor before: `Error::Conflict`, which a claim held by someone else is.) ⚠ `"0.1.89"` is a
# range `>=0.1.89, <0.2.0`.
ikigai-core = "0.1.89"
# The store's namespace, capability constants and term constructors, named rather than
# copied: this crate declares `urn:cap:store:{read,write}:graph:*` on its own actions
# because a ledger read and write really do need them (sub-requests carry the CALLER's
# capability unchanged), and a copied constant would drift from the endpoint that
# enforces it. **0.2.2 is the true minimum**: it is the version carrying both narrow
# doors — `urn:iki:store:graph-update` (0.2.1) and `urn:iki:store:graph-{select,ask}`
# with `CAP_READ_GRAPH` (0.2.2) — and this crate resolves nothing through the broad
# ones except the one root-only listing query documented in `endpoints::LedgersEndpoint`.
# `ikigai_store::sparql` (0.2.1) is where the term constructors come from. Default features
# only: the RocksDB backend is the HOST's choice, taken in the host's manifest, and
# nothing in this library needs it. ⚠ `"0.2"` is a range `>=0.2.0, <0.3.0`; when the
# store reaches 0.3 this line must move or this crate freezes out of it.
ikigai-store = { version = "0.2.2", default-features = false }

# `Endpoint::invoke` is `async_trait`, and these endpoints carry state (the vocabulary,
# the policy registry, the short-id allocator), so they are `Endpoint` impls rather than
# `FnEndpoint` closures.
async-trait = "0.1"

# Reading and writing RDF without hand-rolling either. ★ Hand-built Turtle is how an
# escaping bug ships: a title containing a quote, a newline or a backslash is ordinary
# ledger content, and `oxrdfio`'s serializer is the only thing here that is not guessing.
# The same pair ikigai-log and ikigai-sign parse with, and pure Rust.
oxrdf = "0.3"
oxrdfio = "0.2"

# SPARQL SELECT results arrive as `application/sparql-results+json` from
# `urn:iki:store:select` — the store's default and the only result face that is both
# typed and trivially parseable. Nothing else here is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The tombstone's content hash: what a purge destroyed, in a form a later claim about
# it can be checked against. `sha256:` tagged, the digest convention ikigai-sign set and
# ikigai-log took, so the three join in a query instead of colliding.
sha2 = "0.10"

# The id nonce's entropy in the BROWSER only (ledger #797). On `wasm32-unknown-unknown`
# `std` has no entropy source, so `RandomState` — what native and WASI mint from — is
# seeded the same way in every instance, and every wasm load would mint the same ids.
# `wasm_js` selects the JS `crypto` backend with no rustflags from 0.3.4, the floor core
# takes for the same reason; oxigraph's `js` face already puts 0.3.x in this graph, so it
# costs nothing new. ⚠ `"0.3.4"` is a range `>=0.3.4, <0.4.0`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
futures = "0.3"
# The module recipe as one test. 0.6.0 is the floor: SPACE-NAME, which holds `space()` to
# the name it claims and `space_with*` to claiming none (ledger #987). ⚠ `"0.6.0"` is a
# range `>=0.6.0, <0.7.0`: the previous `"0.3"` was a CEILING that froze this crate out of
# 0.4 through 0.6 while it still reported green against the old definition of "done".
ikigai-conformance = "0.6.0"
# The store this ledger is written against, with the durable backend ON — so
# `tests/durable.rs` proves the composition over a real `DurableStore::open`, and not
# only over the in-memory twin. ⚠ Cargo feature unification is global: this enables
# `oxigraph/rocksdb` for the whole TEST build (the library build is untouched), which
# costs an `oxrocksdb-sys` compile once per cache.
ikigai-store = { version = "0.2.2", features = ["persistent"] }
# `TurtleRenderer` for the `Meta` face. ⚠ Without a JSON meta renderer the engine's pipe
# routing cannot be observed at all (it fails open onto an input named `in`), so the
# conformance kernel is built with `Kernel::with_meta_renderer`, never `Kernel::new`.
ikigai-vocab = "0.1"
