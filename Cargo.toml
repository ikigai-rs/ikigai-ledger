[package]
name = "ikigai-ledger"
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-ledger"
homepage = "https://github.com/ikigai-rs/ikigai-ledger"
keywords = ["ikigai", "roc", "issues", "rdf", "ledger"]
categories = ["development-tools"]
description = "The work ledger for ikigai: NAMED ledgers — one named graph and one capability each — holding items, comments, labels, links and claims as RDF in a durable store, with view/query/append/comment/close/delete as capability-gated resources, and `urn:iki:ledger:next`, a deterministic ready set under a pluggable ordering policy that refuses a blocked cycle and explains its own ranking."

# ★ WHY THIS CRATE OWNS NO BYTES. Everything here is authored as SPARQL and issued
# through the kernel at `urn:iki:store:*` — `ikigai-store` owns the dataset, the write
# lock and the golden threads. That is not a layering preference: `DurableStore`'s
# handle is `pub(crate)` by design (handing it out forfeits cacheability for the life
# of the store), so an in-process consumer reaches the data the same way a remote one
# does. The consequence a host must know: this module is inert unless a store space is
# bound in the same kernel. See `README.md`, "Composition".
#
# ⚠ AND THE CONSEQUENCE FOR SEGMENTATION: a ledger is a named graph, but the store's
# read and write scopes are both dataset-wide in 0.2.0, so this crate's per-ledger
# capabilities gate its own resources and nothing else. `README.md`, "What is enforced,
# and where", states exactly which half is which.

[dependencies]
# 0.1.93 is the true minimum: it is where a principal becomes a capability scope
# (`Capability::principal` and `acts_as`, ledger #1077), which a claim records as its holder's
# principal and a release checks (ledger #1199). (0.1.89 was the floor before: `space_iri`,
# so `space()` names itself `urn:iki:space:ledger`, ledger #987; and 0.1.80 before that:
# `Error::Conflict`.) ⚠ `"0.1.93"` is a range `>=0.1.93, <0.2.0`.
ikigai-core = "0.1.93"
# The store's namespace, capability constants and term constructors, named rather than
# copied: this crate declares `urn:cap:store:{read,write}:graph:*` on its own actions
# because a ledger read and write really do need them (sub-requests carry the CALLER's
# capability unchanged), and a copied constant would drift from the endpoint that
# enforces it. The narrow doors — `urn:iki:store:graph-update` (0.2.1) and
# `urn:iki:store:graph-{select,ask}` with `CAP_READ_GRAPH` (0.2.2) — are what this crate
# resolves; it touches the broad ones only in the one root-only listing query documented in
# `endpoints::LedgersEndpoint`. `ikigai_store::sparql` (0.2.1) is where the term constructors
# come from. ★ **But 0.2.10 is the floor, and it is a SECURITY floor** (ledger #1085, #1083):
# every ledger caller must also hold this ledger's store graph grants, and with them can
# resolve those doors directly. Up to 0.2.9, in any host where `oxigraph/http-client` is
# unified on (`ikigai-cli`, through rudof), a `SERVICE <http://…>` or `LOAD <url> INTO GRAPH`
# sent there was an outbound request — so a ledger's published grant list was a grant to make
# network requests. 0.2.10 refuses both at every door. `tests/service_egress.rs` is the
# reproduction. ★ **And 0.2.21 is the floor now, a SECOND security floor, not an API one**
# (ledger #1426, #1427, #1428, #1429): a `GRAPH` block, and three planner-erasable wrappers, hid
# join operands from the store's join bound, so an in-bounds query planned uncancellably for
# minutes; the overdue-evaluation cap now reserves its slot at start; and `urn:iki:store:load`
# bounds document size and XML entity expansion. A ledger caller can resolve those doors
# directly, as above, so a host composing this ledger must not resolve a store without them.
# Caret alone admits 0.2.21 but does not REQUIRE it: a consumer's lock could keep an older
# store under a fresh ledger. This crate uses no API newer than 0.2.10. Default features only:
# the RocksDB backend is the HOST's choice, taken in the host's manifest, and nothing in this
# library needs it. ⚠ `"0.2.21"` is a range `>=0.2.21, <0.3.0`; when the store reaches 0.3 this
# line must move or this crate freezes out of it.
ikigai-store = { version = "0.2.21", default-features = false }

# `Endpoint::invoke` is `async_trait`, and these endpoints carry state (the vocabulary,
# the policy registry, the short-id allocator), so they are `Endpoint` impls rather than
# `FnEndpoint` closures.
async-trait = "0.1"

# Reading and writing RDF without hand-rolling either. ★ Hand-built Turtle is how an
# escaping bug ships: a title containing a quote, a newline or a backslash is ordinary
# ledger content, and `oxrdfio`'s serializer is the only thing here that is not guessing.
# The same pair ikigai-log and ikigai-sign parse with, and pure Rust.
oxrdf = "0.3"
oxrdfio = "0.2"

# SPARQL SELECT results arrive as `application/sparql-results+json` from
# `urn:iki:store:select` — the store's default and the only result face that is both
# typed and trivially parseable. Nothing else here is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The tombstone's content hash: what a purge destroyed, in a form a later claim about
# it can be checked against. `sha256:` tagged, the digest convention ikigai-sign set and
# ikigai-log took, so the three join in a query instead of colliding.
sha2 = "0.10"

# The id nonce's entropy in the BROWSER only (ledger #797). On `wasm32-unknown-unknown`
# `std` has no entropy source, so `RandomState` — what native and WASI mint from — is
# seeded the same way in every instance, and every wasm load would mint the same ids.
# `wasm_js` selects the JS `crypto` backend with no rustflags from 0.3.4, the floor core
# takes for the same reason; oxigraph's `js` face already puts 0.3.x in this graph, so it
# costs nothing new. ⚠ `"0.3.4"` is a range `>=0.3.4, <0.4.0`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

# ⚠ A test GATE, never a `cfg` on a code path: this crate builds no SPARQL evaluator and has
# no network code. It turns on `oxigraph/http-client` (through the store) so a build can be
# made the way `ikigai-cli` is made by unification, where oxigraph installs an HTTP service
# handler on every evaluator that does not refuse one. `tests/service_egress.rs` cfg's only its
# CONTROL on this (raw oxigraph really reaches a local stub, so the refusals are not vacuous);
# the refusals run in every build. CI runs it through `features: "http-client"` (§9c).
[features]
http-client = ["ikigai-store/http-client"]

[dev-dependencies]
futures = "0.3"
# The control in `tests/service_egress.rs` only: a raw `SparqlEvaluator` the store did NOT
# build, to show the `http-client` build really does fetch. The same oxigraph the store
# resolves (it pins 0.5.1 as its floor); default features off so this adds no backend.
oxigraph = { version = "0.5.1", default-features = false }
# The module recipe as one test. 0.8.0 brought REQUIRED, which drops each required
# by-value input and expects a typed refusal, and `Suite::own` (ledger #329, #328); 0.6.0
# brought SPACE-NAME (ledger #987). 0.9.0 added core 0.1.105's contract-shape checks
# (REQUIRED probes input groups, OUTPUTS honors output_from, PIPELINE's named-only line,
# VALIDATE refuses a default on a binding) and RECOMPUTE; 0.10.0 added FAILURES, OFF unless
# a suite opts in (`check_failures()`). ⚠ `"0.10.0"` is a range `>=0.10.0, <0.11.0`: a 0.x
# caret is a CEILING too, and `"0.8.0"` froze this crate below 0.9 while it still reported
# green against the old definition of "done". Re-read it as a range when 0.11 lands.
ikigai-conformance = "0.10.0"
# The store this ledger is written against, with the durable backend ON — so
# `tests/durable.rs` proves the composition over a real `DurableStore::open`, and not
# only over the in-memory twin. ⚠ Cargo feature unification is global: this enables
# `oxigraph/rocksdb` for the whole TEST build (the library build is untouched), which
# costs an `oxrocksdb-sys` compile once per cache. The same 0.2.21 security floor as above.
ikigai-store = { version = "0.2.21", features = ["persistent"] }
# `TurtleRenderer` for the `Meta` face. ⚠ Without a JSON meta renderer the engine's pipe
# routing cannot be observed at all (it fails open onto an input named `in`), so the
# conformance kernel is built with `Kernel::with_meta_renderer`, never `Kernel::new`.
ikigai-vocab = "0.1"
